<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونەژوورەوەی کرێکار</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>چوونەژوورەوەی کرێکار</h1>
    </header>

    <main class="form-body">
      <form id="loginForm" class="blank-form">
        <div class="form-field">
          <label for="loginId">ئایدی</label>
          <input type="text" id="loginId" name="loginId" required dir="ltr" style="text-align:left">
        </div>
        <div class="form-field">
          <label for="loginPass">پاسۆرد</label>
          <input type="password" id="loginPass" name="loginPass" required dir="ltr" style="text-align:left">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">چوونەژوورەوە</button>
        </div>
      </form>
      <p class="empty-msg" id="backHome" hidden><a href="index.html">گەڕانەوە بۆ سەرەتا</a></p>
    </main>
  </div>

  <script src="remote-accounts.js"></script>
  <script src="worker-login.js"></script>
  <script src="sync.js"></script>
</body>
</html>
