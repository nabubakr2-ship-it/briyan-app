<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تۆماری کرێکاران</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
</head>
<body>
  <div class="container">
    <header class="app-header form-header">
      <button id="backBtn" class="back-btn">&rarr; گەڕانەوە</button>
      <h1>تۆماری کرێکاران</h1>
    </header>

    <main class="form-body">
      <div class="form-field" style="margin-bottom:14px">
        <input type="text" id="searchBox" placeholder="گەڕان..."><label>گەڕان</label>
      </div>
      <div class="inst-pay-box" style="flex-direction:row;justify-content:space-between;margin-bottom:14px">
        <div class="calc-card c-blue" style="flex:1">
          <span class="calc-label">کۆی بڕی ڕۆژانە</span>
          <strong class="calc-value"><span id="totalRate">0</span> د.ع</strong>
        </div>
        <div class="calc-card c-purple" style="flex:1">
          <span class="calc-label">کۆی بڕی مەسروف</span>
          <strong class="calc-value"><span id="totalExpense">0</span> د.ع</strong>
        </div>
        <div class="calc-card c-olive" style="flex:1">
          <span class="calc-label">کۆی گشتی</span>
          <strong class="calc-value"><span id="totalGrand">0</span> د.ع</strong>
        </div>
      </div>
      <section class="records-section">
        <h2>لیستی زانیاری کرێکاران</h2>
        <div class="filter-row" style="margin-bottom:10px">
          <select id="filterWorker">
            <option value="">-- هەموو کرێکاران --</option>
          </select>
          <select id="filterOwner">
            <option value="">-- هەموو خاوەن ماڵەکان --</option>
          </select>
        </div>
        <div id="summaryBody"></div>
        <div class="info-row total-row"><span>کۆی گشتی پارەی هەموو کرێکارەکان</span><span id="grandTotal"></span></div>
      </section>
      <section class="records-section">
        <h2>تۆمارەکان</h2>
        <ul id="recordsList" class="records-list"></ul>
        <p id="emptyMsg" class="empty-msg">هێشتا هیچ تۆمارێک نییە</p>
      </section>
    </main>
  </div>

  <script src="worker-records.js"></script>
  <script src="sync.js"></script>
</body>
</html>
