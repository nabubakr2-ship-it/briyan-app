<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ئیشی تەواو کراو</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
</head>
<body>
  <div class="container">
    <header class="app-header form-header">
      <button id="backBtn" class="back-btn">&rarr; گەڕانەوە</button>
      <h1>ئیشی تەواو کراو</h1>
    </header>

    <main class="form-body">
      <form id="completedForm" class="blank-form">
        <div class="form-field">
          <label for="ownerName">ناوی خاوەن ماڵ</label>
          <input type="text" id="ownerName" name="ownerName" required>
        </div>
        <div class="form-field">
          <label for="mobile">ژمارە موبایل</label>
          <input type="tel" id="mobile" name="mobile" inputmode="tel" required>
        </div>
        <div class="form-field">
          <label for="jobType">جۆری ئیش</label>
          <select id="jobType" name="jobType" required>
            <option value="">-- هەڵبژێرە --</option>
            <option value="شکان">شکان</option>
            <option value="محالەجە">محالەجە</option>
          </select>
        </div>
        <div class="form-field" id="agreementField" hidden>
          <label for="agreementType">جۆری ڕێک کەوتن</label>
          <select id="agreementType" name="agreementType">
            <option value="">-- هەڵبژێرە --</option>
            <option value="مەتر تووڵ">مەتر تووڵ</option>
            <option value="مەتر مرەبەح">مەتر مرەبەح</option>
            <option value="مەتر تووڵ و مرەبەح">مەتر تووڵ و مرەبەح</option>
            <option value="گۆترە">گۆترە</option>
          </select>
        </div>
        <div class="form-field" id="shkanPriceField" hidden>
          <label for="shkanPrice">بڕی پارە (د.ع)</label>
          <input type="number" id="shkanPrice" name="shkanPrice" min="0" step="any">
          <label for="shkanTotal">کۆی پارە (د.ع)</label>
          <input type="text" id="shkanTotal" readonly>
        </div>
        <div id="priceFields" hidden>
          <div class="form-field" id="singleFields" hidden>
            <label for="price">نرخ ($)</label>
            <input type="number" id="price" name="price" min="0" step="any">
            <label for="meter">بڕی مەتر</label>
            <input type="number" id="meter" name="meter" min="0" step="any">
            <label for="total">کۆی پارە ($)</label>
            <input type="text" id="total" readonly>
          </div>
          <div id="doubleFields" hidden>
            <div class="form-field">
              <label for="priceWool">نرخی تووڵ ($)</label>
              <input type="number" id="priceWool" name="priceWool" min="0" step="any">
            </div>
            <div class="form-field">
              <label for="priceMarble">نرخی مرەبەح ($)</label>
              <input type="number" id="priceMarble" name="priceMarble" min="0" step="any">
            </div>
            <div class="form-field">
              <label for="meterWool">بڕی مەتر تووڵ</label>
              <input type="number" id="meterWool" name="meterWool" min="0" step="any">
            </div>
            <div class="form-field">
              <label for="meterMarble">بڕی مەتر مرەبەح</label>
              <input type="number" id="meterMarble" name="meterMarble" min="0" step="any">
            </div>
            <div class="form-field">
              <label for="totalWool">کۆی پارە تووڵ ($)</label>
              <input type="text" id="totalWool" readonly>
            </div>
            <div class="form-field">
              <label for="totalMarble">کۆی پارە مرەبەح ($)</label>
              <input type="text" id="totalMarble" readonly>
            </div>
            <div class="form-field">
              <label for="grandTotal">کۆی پارە ($)</label>
              <input type="text" id="grandTotal" readonly>
            </div>
          </div>
        </div>
        <div class="form-field">
          <label for="completeDate">بەرواری تەواوکردن</label>
          <input type="date" id="completeDate" name="completeDate" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">پاشەکەوت</button>
        </div>
      </form>

      <section class="records-section">
        <h2>تۆمارەکان</h2>
        <ul id="recordsList" class="records-list"></ul>
        <p id="emptyMsg" class="empty-msg">هێشتا هیچ تۆمارێک نییە</p>
      </section>
    </main>
  </div>

  <div id="infoModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>کۆی زانیاریەکان</h2>
        <button id="modalClose" class="back-btn">داخستن</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="completed.js"></script>
  <script src="sync.js"></script>
</body>
</html>
