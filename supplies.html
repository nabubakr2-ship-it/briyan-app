<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کڕینی پێداویستی</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
</head>
<body>
  <div class="container">
    <header class="app-header form-header">
      <button id="backBtn" class="back-btn">&rarr; گەڕانەوە</button>
      <h1>کڕینی پێداویستی</h1>
    </header>

    <main class="form-body">
      <form id="supplyForm" class="blank-form">
        <div class="form-field">
          <label for="buyDate">بەرواری کڕین</label>
          <input type="date" id="buyDate" name="buyDate" required>
        </div>
        <div class="form-field">
          <label for="shopName">ناوی دوکاندار</label>
          <input type="text" id="shopName" name="shopName">
        </div>
        <div class="form-field">
          <label for="payType">جۆری پارەدان</label>
          <select id="payType" name="payType">
            <option value="">-- هەڵبژێرە --</option>
            <option value="نەقد">نەقد</option>
            <option value="قەرز">قەرز</option>
          </select>
        </div>
        <div class="form-field">
          <label for="note">تێبینی</label>
          <input type="text" id="note" name="note">
        </div>
        <div class="form-field">
          <label>کاڵاکان</label>
          <div class="items-table">
            <div class="items-head">
              <span>جۆری کاڵا</span>
              <span>بڕی پارە</span>
            </div>
            <div id="itemsBody"></div>
          </div>
          <div class="total-expense">کۆی گشتی: <strong id="totalAmount">0</strong></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">پاشەکەوت</button>
        </div>
      </form>

      <button type="button" id="recordsToggleBtn" class="btn-summary">تۆماری کاڵاکان</button>
    </main>
  </div>

  <script src="supplies.js"></script>
  <script src="sync.js"></script>
</body>
</html>
